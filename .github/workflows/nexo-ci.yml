name: NEXO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime smoke-test dependencies
        run: python -m pip install --disable-pip-version-check "python-telegram-bot>=22,<23" python-dotenv
      - name: Syntax check
        run: python -m compileall -q .
      - name: Bootstrap wrapper syntax
        run: |
          bash -n bootstrap.sh
          python scripts/bootstrap_nexo.py --help
      - name: Shell deployment script syntax
        run: |
          bash -n scripts/auto_update.sh
          bash -n scripts/bootstrap_nexo_deploy.sh
      - name: Runtime import check
        run: python -c "import telegram_llama; print('telegram runtime import: PASS')"
      - name: Core unit tests
        run: python -m unittest discover -s tests -v
