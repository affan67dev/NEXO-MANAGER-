name: NEXO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android MVB dependency profile
        run: python -m pip install --disable-pip-version-check -r requirements-nexo-mvb.txt
      - name: Syntax check
        run: python -m compileall -q .
      - name: ALEX controller syntax
        run: python scripts/alexctl.py --help
      - name: Bootstrap wrapper syntax
        shell: bash
        run: |
          bash -n bootstrap.sh
          python scripts/bootstrap_nexo.py --help
      - name: Shell deployment script syntax
        shell: bash
        run: |
          bash -n scripts/auto_update.sh
          bash -n scripts/bootstrap_nexo_deploy.sh
      - name: Runtime import check
        run: >-
          python -c "import telegram_llama; print('telegram runtime import: PASS')"
      - name: Core unit tests
        run: python -m unittest discover -s tests -v
